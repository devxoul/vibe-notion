name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (x.y.z)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Bump version
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
          bun -e "
            const fs = require('fs');
            const v = '${{ inputs.version }}';
            for (const dir of fs.readdirSync('skills')) {
              const p = 'skills/' + dir + '/SKILL.md';
              if (fs.existsSync(p)) {
                let s = fs.readFileSync(p, 'utf8');
                s = s.replace(/^version: .+$/m, 'version: ' + v);
                fs.writeFileSync(p, s);
              }
            }
            const writeJson = (p, data) => fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            plugin.version = v;
            writeJson('.claude-plugin/plugin.json', plugin);
            const marketplace = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            for (const p of marketplace.plugins) {
              if (p.name === plugin.name) p.version = v;
            }
            writeJson('.claude-plugin/marketplace.json', marketplace);
          "

      - name: Verify versions
        run: |
          bun -e "
            const fs = require('fs');
            const v = '${{ inputs.version }}';
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const marketplace = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const versions = {
              'package.json': JSON.parse(fs.readFileSync('package.json', 'utf8')).version,
              '.claude-plugin/plugin.json': plugin.version,
              '.claude-plugin/marketplace.json': marketplace.plugins.find((p) => p.name === plugin.name)?.version,
            };
            for (const dir of fs.readdirSync('skills')) {
              const p = 'skills/' + dir + '/SKILL.md';
              if (fs.existsSync(p)) versions[p] = fs.readFileSync(p, 'utf8').match(/^version: (.+)$/m)?.[1];
            }
            const mismatched = Object.entries(versions).filter(([, actual]) => actual !== v);
            if (mismatched.length) {
              console.error('Version mismatch (expected ' + v + '):', mismatched);
              process.exit(1);
            }
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json skills/*/SKILL.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git diff --staged --quiet || git commit -m "${{ inputs.version }}"
          git tag "${{ inputs.version }}"
          git push origin HEAD --tags

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        run: gh release create "${{ inputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}


